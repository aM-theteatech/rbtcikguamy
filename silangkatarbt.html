<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teka Silang Kata | Reka Bentuk Makanan</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#17324d;background:#eef5fb}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:1050px;margin:auto}header,.panel{background:white;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 4px 20px #153a5b12}h1{margin:0 0 8px}p{line-height:1.5}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,1fr);gap:18px}.grid{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));width:100%;max-width:560px;margin:auto;border:2px solid #244b69;background:#244b69;gap:1px}.cell{aspect-ratio:1;background:#fff;position:relative;min-width:0}.cell.black{background:#244b69}.cell.active{background:#d8edff}.cell.correct{background:#d8f8e2}.cell.wrong{background:#ffe3e3}.cell small{position:absolute;top:1px;left:2px;font-size:clamp(7px,1.2vw,10px);font-weight:bold}.cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:clamp(10px,2vw,20px);font-weight:700;text-transform:uppercase;padding:7px 0 0;color:#17324d;outline-offset:-3px}.clue{width:100%;text-align:left;border:1px solid #d4e3ee;border-radius:10px;padding:10px;margin:6px 0;background:#fff;color:#17324d;cursor:pointer}.clue.selected{border-color:#1672c4;background:#e7f3ff}.clue .status{float:right;font-weight:bold}button.action{border:0;background:#1767b0;color:white;border-radius:9px;padding:12px 16px;margin:4px;cursor:pointer;font-weight:bold}button.secondary{background:#516a80}#feedback{font-weight:bold;min-height:28px}label{display:block;font-weight:bold;margin-bottom:5px}#student{padding:10px;border:1px solid #b9cddd;border-radius:8px;width:100%;max-width:350px}@media(max-width:760px){.layout{grid-template-columns:1fr}body{padding:9px}header,.panel{padding:13px}.grid{max-width:100%}}@media print{button,#student{display:none}body{background:white}.panel,header{box-shadow:none}}</style></head><body><main class="wrap"><header><h1>🧩 Teka Silang Kata: Reka Bentuk Makanan</h1><p><b>RBT Tingkatan 2 · Bab 2.6</b> — Jawab 10 petunjuk berdasarkan nota pembelajaran. Klik petunjuk atau petak untuk memilih perkataan. Taip satu huruf bagi setiap petak.</p><label for="student">Nama murid (pilihan)</label><input id="student" placeholder="Masukkan nama anda"></header><div class="layout"><section class="panel"><div id="grid" class="grid" aria-label="Grid teka silang kata"></div><p id="feedback" role="status" aria-live="polite"></p><button class="action" id="check">Semak jawapan</button><button class="action secondary" id="reveal">Tunjuk jawapan</button><button class="action secondary" id="reset">Cuba semula</button><button class="action secondary" id="print">Cetak</button></section><section class="panel"><h2>Petunjuk</h2><div id="clues"></div></section></div></main><script>
'use strict';
const data=[
{answer:'ESTETIKA',clue:'Nilai keindahan yang dapat menambah daya tarikan sesuatu produk makanan.'},
{answer:'TEKSTUR',clue:'Struktur atau keadaan permukaan sesuatu makanan.'},
{answer:'GARISAN',clue:'Elemen reka bentuk yang merujuk kepada pergerakan titik dalam ruang.'},
{answer:'WARNA',clue:'Elemen reka bentuk yang berfungsi menarik perhatian pengguna.'},
{answer:'RUANG',clue:'Kawasan kosong yang dikelilingi objek atau jarak antara objek.'},
{answer:'SAIZ',clue:'Ukuran atau dimensi sesuatu objek.'},
{answer:'INOVASI',clue:'Proses penambahbaikan idea untuk menghasilkan reka bentuk yang lebih baik dan efektif.'},
{answer:'KREATIVITI',clue:'Keupayaan menghasilkan idea imaginasi bagi mencipta sesuatu yang menarik dan unik.'},
{answer:'PENERAP',clue:'Alat untuk membentuk doh, sayuran berubi dan buah-buahan.'},
{answer:'PENGUKUS',clue:'Alat elektrik yang digunakan untuk mengukus makanan.'}
];
// Place words automatically, enforcing valid crossings and no adjacent parallel words.
const N=16;let best=null;
function attempt(seed){const grid=Array.from({length:N},()=>Array(N).fill(''));const placements=[];const order=[...data.keys()];for(let i=order.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;let j=seed%(i+1);[order[i],order[j]]=[order[j],order[i]]}order.sort((a,b)=>data[b].answer.length-data[a].answer.length);
function valid(word,r,c,dir){const dr=dir==='v'?1:0,dc=dir==='h'?1:0;const beforeR=r-dr,beforeC=c-dc,afterR=r+dr*word.length,afterC=c+dc*word.length;if(beforeR>=0&&beforeC>=0&&grid[beforeR][beforeC])return false;if(afterR<N&&afterC<N&&grid[afterR][afterC])return false;let crossings=0;for(let k=0;k<word.length;k++){let y=r+dr*k,x=c+dc*k;if(y<0||y>=N||x<0||x>=N)return false;const old=grid[y][x];if(old&&old!==word[k])return false;if(old){if(placements.some(p=>p.dir===dir&&p.cells.some(z=>z.r===y&&z.c===x)))return false;crossings++}else if(dir==='h'){if((y>0&&grid[y-1][x])||(y<N-1&&grid[y+1][x]))return false}else if((x>0&&grid[y][x-1])||(x<N-1&&grid[y][x+1]))return false}return placements.length===0||crossings>0}
for(const id of order){const word=data[id].answer;let options=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const dir of ['h','v'])if(valid(word,r,c,dir)){let crosses=0;for(let k=0;k<word.length;k++)if(grid[r+(dir==='v'?k:0)][c+(dir==='h'?k:0)])crosses++;options.push({r,c,dir,crosses,dist:Math.abs(r-N/2)+Math.abs(c-N/2)})}options.sort((a,b)=>b.crosses-a.crosses||a.dist-b.dist);if(!options.length)continue;const p=options[0],cells=[];for(let k=0;k<word.length;k++){const r=p.r+(p.dir==='v'?k:0),c=p.c+(p.dir==='h'?k:0);grid[r][c]=word[k];cells.push({r,c})}placements.push({...p,id,cells})}return {grid,placements}}
for(let s=1;s<=1200;s++){let a=attempt(s*7919);if(!best||a.placements.length>best.placements.length)best=a;if(best.placements.length===data.length)break}
// Fallback still produces a playable puzzle if packing cannot fit all words.
const {grid,placements}=best;const used=placements.map(p=>p.id);if(used.length!==data.length)console.warn('Some clues could not be placed',data.length-used.length);
const cells=new Map(),inputs=new Map();const gridEl=document.getElementById('grid'),cluesEl=document.getElementById('clues');let selected=placements[0];const starts=new Map();placements.forEach(p=>{let key=p.r+','+p.c;if(!starts.has(key))starts.set(key,starts.size+1);p.num=starts.get(key)});
for(let r=0;r<N;r++)for(let c=0;c<N;c++){let el=document.createElement('div'),key=r+','+c;el.className='cell'+(grid[r][c]?'':' black');if(grid[r][c]){if(starts.has(key)){let sm=document.createElement('small');sm.textContent=starts.get(key);el.append(sm)}let inp=document.createElement('input');inp.maxLength=1;inp.autocomplete='off';inp.setAttribute('aria-label','Baris '+(r+1)+' lajur '+(c+1));inp.addEventListener('focus',()=>{let p=placements.find(p=>p.cells.some(z=>z.r===r&&z.c===c));if(p)select(p,false)});inp.addEventListener('click',()=>{const hits=placements.filter(p=>p.cells.some(z=>z.r===r&&z.c===c));if(hits.length>1&&selected&&hits.includes(selected))select(hits.find(p=>p!==selected),false)});inp.addEventListener('input',()=>{inp.value=inp.value.toUpperCase().replace(/[^A-Z]/g,'');clearFeedback();if(inp.value){let idx=selected.cells.findIndex(z=>z.r===r&&z.c===c);if(idx>=0&&idx<selected.cells.length-1){let next=selected.cells[idx+1];inputs.get(next.r+','+next.c).focus()}}});inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value){let idx=selected.cells.findIndex(z=>z.r===r&&z.c===c);if(idx>0){let prev=selected.cells[idx-1];inputs.get(prev.r+','+prev.c).focus()}}});el.append(inp);inputs.set(key,inp)}gridEl.append(el);cells.set(key,el)}
function select(p,focus=true){selected=p;document.querySelectorAll('.cell').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.clue').forEach(e=>e.classList.remove('selected'));p.cells.forEach(z=>cells.get(z.r+','+z.c).classList.add('active'));document.getElementById('clue-'+p.id).classList.add('selected');if(focus){let z=p.cells[0];inputs.get(z.r+','+z.c).focus()}}
placements.sort((a,b)=>a.num-b.num||a.dir.localeCompare(b.dir));for(const p of placements){let b=document.createElement('button');b.className='clue';b.id='clue-'+p.id;b.innerHTML='<b>'+p.num+'. '+(p.dir==='h'?'Melintang':'Menegak')+'</b> <span class="status" id="status-'+p.id+'"></span><br>'+data[p.id].clue+' <small>('+data[p.id].answer.length+' huruf)</small>';b.addEventListener('click',()=>select(p));cluesEl.append(b)}select(selected,false);
function clearFeedback(){document.getElementById('feedback').textContent='';document.querySelectorAll('.cell').forEach(e=>e.classList.remove('correct','wrong'));placements.forEach(p=>document.getElementById('status-'+p.id).textContent='')}
function check(){clearFeedback();let score=0;for(const p of placements){const guess=p.cells.map(z=>inputs.get(z.r+','+z.c).value).join('');let ok=guess===data[p.id].answer;if(ok)score++;document.getElementById('status-'+p.id).textContent=ok?'✓':'✗';p.cells.forEach(z=>cells.get(z.r+','+z.c).classList.add(ok?'correct':'wrong'))}document.getElementById('feedback').textContent='Markah: '+score+'/'+placements.length+(score===placements.length?' — Tahniah! Semua jawapan betul.':' — Semak petak berwarna merah dan cuba lagi.')}document.getElementById('check').addEventListener('click',check);
document.getElementById('reveal').addEventListener('click',()=>{for(const p of placements)p.cells.forEach((z,i)=>inputs.get(z.r+','+z.c).value=data[p.id].answer[i]);clearFeedback();document.getElementById('feedback').textContent='Jawapan dipaparkan. Klik Cuba semula untuk mengulang latihan.'});document.getElementById('reset').addEventListener('click',()=>{inputs.forEach(i=>i.value='');clearFeedback();select(placements[0]);});document.getElementById('print').addEventListener('click',()=>window.print());
</script></body></html>
